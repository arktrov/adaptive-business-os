services:
  postgres:
    image: postgres:16-alpine
    container_name: adaptive-business-os-postgres
    environment:
      POSTGRES_USER: abo_dev
      POSTGRES_PASSWORD: abo_dev_password
      POSTGRES_DB: adaptive_business_os
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - abo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abo_dev -d adaptive_business_os"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  abo_pgdata:
