<!doctype html><html lang="de"><meta charset="utf-8"><title>Adaptive Business OS</title><style>body{font:16px system-ui;max-width:900px;margin:2rem auto;color:#17202a}section{border:1px solid #ddd;border-radius:8px;padding:1rem;margin:1rem 0}label{display:block;margin:.5rem 0}button{padding:.6rem 1rem}li{margin:.4rem}</style><h1>Adaptive Business OS</h1><section><h2>Businesses</h2><div id="businesses"></div></section><section><h2>Content Job anlegen</h2><form id="form"><label>Titel <input name="working_title" value="ARKTROV Video 005"></label><label>Format <select name="format"><option>SHORT</option><option>LONG</option><option>BOTH</option></select></label><button>Anlegen</button></form><p id="msg"></p></section><section><h2>Content Jobs</h2><ul id="jobs"></ul></section><script>const $=s=>document.querySelector(s);let biz;async function load(){biz=(await (await fetch('/api/businesses')).json())[0];$('#businesses').textContent=biz.name+' ('+biz.id+')';const jobs=await (await fetch('/api/jobs')).json();$('#jobs').innerHTML=jobs.map(j=>`<li><b>${j.working_title||'Ohne Titel'}</b> · ${j.format} · ${j.current_state} · ${new Date(j.created_at).toLocaleString()}</li>`).join('')||'<li>Keine Jobs</li>'}$('#form').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.business_id=biz.id;d.idempotency_key='ui-'+crypto.randomUUID();const r=await fetch('/api/jobs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d)});$('#msg').textContent=r.ok?'Job angelegt':'Fehler';load()};load()</script></html>
