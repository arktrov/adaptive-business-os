<!doctype html>
<html lang="de"><meta charset="utf-8"><title>Adaptive Business OS</title>
<style>body{font:16px system-ui;max-width:1100px;margin:2rem auto;padding:0 1rem;color:#17202a}section{border:1px solid #ddd;border-radius:8px;padding:1rem;margin:1rem 0}label{display:block;margin:.5rem 0}button{padding:.5rem}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:.35rem;border-bottom:1px solid #ddd;text-align:left;overflow-wrap:anywhere}pre{white-space:pre-wrap}#error{color:#a00}</style>
<h1>Adaptive Business OS</h1><section><h2>Businesses</h2><div id="businesses"></div></section>
<section><h2>Content Job anlegen</h2><form id="form"><label>Titel <input name="working_title"></label><label>Format <select name="format"><option>SHORT</option><option>LONG</option><option>BOTH</option></select></label><button>Anlegen</button></form><p id="error" role="alert"></p></section>
<section><h2>Content Jobs</h2><ul id="jobs"></ul></section>
<section id="detail" hidden><h2>Job Detail</h2><pre id="meta"></pre>
<h3>STATE HISTORY</h3><div id="history"></div><h3>EVIDENCE</h3><div id="evidence"></div>
<h3>ARTIFACTS</h3><div id="artifacts"></div><h3>QUALITY</h3><div id="quality"></div>
<h3>RESEARCH</h3><div id="research"></div><h3>FACT GUARD</h3><div id="fact-guard"></div><h3>SCRIPT</h3><div id="scripts"></div><h3>PRODUCTION PACKAGE</h3><div id="production-packages"></div><h3>PUBLISH</h3><div id="publish"></div></section><script type="module" src="/app.js"></script></html>
